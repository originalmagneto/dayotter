name: Runtime Docker verification
on:
  pull_request:
  push:
    branches: [hitl]
permissions:
  contents: read
jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Build both production images and verify isolated web/worker and migration replay
        run: node scripts/runtime-smoke.mjs
